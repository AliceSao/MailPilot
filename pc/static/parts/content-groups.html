<!-- ===== 分组管理内容区 ===== -->
<div id="groups" class="content-section">
    <div class="panel-header" style="display:flex;align-items:center;gap:var(--spacing-12);">
        <button class="toolbar-btn btn-secondary" data-action="switch-section" data-target="emails" title="返回邮箱管理">
            <i class="fas fa-arrow-left"></i> <span>返回</span>
        </button>
        <h1 data-i18n="groupMgmt">分组管理</h1>
    </div>
    <div class="group-management">
        <div class="group-list" id="group-list">
        </div>
        <div class="add-group-form">
            <div class="form-row">
                <input type="text" id="new-group-name" placeholder="输入新分组名称..." data-i18n-placeholder="newGroupPlaceholder">
                <button class="toolbar-btn btn-primary" data-action="add-group">
                    <i class="fas fa-plus"></i><span data-i18n="addGroup">添加分组</span>
                </button>
            </div>
        </div>
    </div>
</div>
